<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Journey of One Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#0E141B;
    --surface:#161F2A;
    --surface-2:#1E2936;
    --line:#2A3846;
    --line-soft:#213040;
    --text:#DCE5EE;
    --dim:#8496A8;
    --faint:#5D7188;

    --compute:#F0883E;
    --compute-soft:#5A3A1E;
    --bandwidth:#4CA6E0;
    --bandwidth-soft:#1B354A;
    --hit:#56D68A;
    --hit-soft:#1C3E2C;
    --reject:#E05C5C;
    --measured:#B98BE0;
    --idle:#313E4C;

    --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --display:"Archivo","IBM Plex Sans","PingFang SC","Hiragino Sans GB",sans-serif;
    --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--ground);color:var(--text);
    font-family:var(--sans);font-size:16px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px}

  /* ---------- language toggle ---------- */
  .lang-toggle{
    position:fixed;top:18px;right:18px;z-index:40;
    display:flex;background:var(--surface-2);border:1px solid var(--line);
    border-radius:20px;padding:3px;gap:2px;
    box-shadow:0 4px 16px rgba(0,0,0,.35);
  }
  .lang-toggle button{
    font-family:var(--mono);font-size:11px;font-weight:600;
    border:none;background:none;color:var(--faint);cursor:pointer;
    padding:6px 12px;border-radius:16px;transition:all .15s;
    letter-spacing:.02em;
  }
  .lang-toggle button:hover{color:var(--text)}
  .lang-toggle button.active{background:var(--bandwidth-soft);color:var(--bandwidth)}
  .lang-toggle button:focus-visible{outline:2px solid var(--bandwidth);outline-offset:2px}

  /* ---------- header ---------- */
  header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#111A24 0%,var(--ground) 100%);
    padding:52px 0 40px;
  }
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);margin:0 0 14px;
  }
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(30px,5vw,48px);letter-spacing:-.02em;line-height:1.08;
    margin:0 0 16px;text-wrap:balance;
  }
  .lede{max-width:76ch;color:var(--dim);font-size:17px;margin:0}
  .lede b{color:var(--text);font-weight:500}

  /* ---------- pipeline stage ---------- */
  .pipeline-wrap{
    padding:44px 0 8px;border-bottom:1px solid var(--line-soft);
    position:sticky;top:0;z-index:30;background:rgba(14,20,27,.97);
    backdrop-filter:blur(10px);
  }
  .pipeline-controls{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .pipeline-controls button{
    font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text);
    background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
    padding:7px 14px;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .pipeline-controls button:hover{background:#26333F;border-color:#3A4A5A}
  .pipeline-controls button:focus-visible{outline:2px solid var(--bandwidth);outline-offset:2px}
  .pipeline-hint{font-family:var(--mono);font-size:11px;color:var(--faint)}

  .pipeline{
    position:relative;overflow-x:auto;overflow-y:visible;
    padding:8px 4px 20px;
  }
  .track{
    display:flex;align-items:flex-start;gap:0;min-width:max-content;position:relative;
  }
  .node{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    width:112px;flex:none;cursor:pointer;padding:4px 2px;
    background:none;border:none;font-family:inherit;color:inherit;
  }
  .node:focus-visible{outline:2px solid var(--bandwidth);outline-offset:3px;border-radius:8px}
  .node-dot{
    width:40px;height:40px;border-radius:50%;
    background:var(--surface-2);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:13px;font-weight:600;color:var(--dim);
    transition:all .2s;position:relative;z-index:2;
  }
  .node.active .node-dot{
    border-color:var(--bandwidth);color:var(--bandwidth);
    background:var(--bandwidth-soft);
    box-shadow:0 0 0 4px rgba(76,166,224,.15);
  }
  .node.compute .node-dot{border-color:var(--compute)}
  .node.compute.active .node-dot{
    color:var(--compute);background:var(--compute-soft);
    box-shadow:0 0 0 4px rgba(240,136,62,.15);
  }
  .node-label{
    font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:center;
    line-height:1.3;min-height:28px;
  }
  .node.active .node-label{color:var(--text);font-weight:500}

  .connector{
    flex:none;width:28px;height:40px;display:flex;align-items:center;margin-top:0;
    position:relative;top:0;
  }
  .connector svg{width:100%;height:2px;display:block}
  .connector line{stroke:var(--line);stroke-width:2}

  /* the "runs every token" loop grouping */
  .loop-box{
    position:relative;display:flex;align-items:flex-start;
    border:1.5px dashed var(--measured);border-radius:14px;
    padding:14px 10px 6px;margin:0 6px;background:rgba(185,139,224,.04);
  }
  .loop-tag{
    position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    background:var(--ground);padding:0 10px;
    font-family:var(--mono);font-size:10px;color:var(--measured);
    letter-spacing:.06em;white-space:nowrap;
  }

  /* packet marker that travels along the pipeline */
  .packet{
    position:absolute;top:22px;width:14px;height:14px;border-radius:50%;
    background:var(--measured);box-shadow:0 0 10px 2px rgba(185,139,224,.6);
    transform:translate(-50%,-50%);transition:left 0s;z-index:5;
    opacity:0;pointer-events:none;
  }
  .packet.on{opacity:1}

  /* ---------- detail cards ---------- */
  main{padding:44px 0 80px}
  .stage-card{
    padding:40px 0;border-bottom:1px solid var(--line-soft);
    scroll-margin-top:200px;
  }
  .stage-card:last-child{border-bottom:0}
  .stage-card.flash{animation:flash 1.1s ease}
  @keyframes flash{
    0%{background:rgba(76,166,224,.08)}
    100%{background:transparent}
  }

  .stage-kicker{
    display:flex;align-items:center;gap:10px;margin-bottom:10px;
  }
  .stage-num{
    font-family:var(--mono);font-size:11px;font-weight:600;
    color:var(--ground);background:var(--dim);padding:2px 8px;border-radius:3px;
  }
  .stage-num.compute{background:var(--compute)}
  .stage-num.bandwidth{background:var(--bandwidth)}
  .stage-tag{
    font-family:var(--mono);font-size:10.5px;color:var(--faint);
    letter-spacing:.06em;text-transform:uppercase;
  }
  .stage-card h2{
    font-family:var(--display);font-weight:700;
    font-size:clamp(21px,3vw,27px);margin:0 0 14px;letter-spacing:-.01em;
  }
  .stage-body{max-width:88ch;color:var(--dim);font-size:15.5px}
  .stage-body p{margin:0 0 12px}
  .stage-body b{color:var(--text);font-weight:500}
  .stage-body code{
    font-family:var(--mono);font-size:.88em;background:var(--surface-2);
    padding:1px 5px;border-radius:3px;color:var(--text);
  }

  /* --- primer box --- */
  .primer{
    max-width:88ch;margin:24px 0 4px;padding:18px 22px;
    background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--measured);border-radius:0 8px 8px 0;
  }
  .primer summary{
    cursor:pointer;list-style:none;font-family:var(--mono);font-size:12px;
    font-weight:600;letter-spacing:.04em;color:var(--measured);
    display:flex;align-items:center;gap:8px;
  }
  .primer summary::-webkit-details-marker{display:none}
  .primer summary::before{content:"▸";transition:transform .15s}
  .primer[open] summary::before{transform:rotate(90deg)}
  .primer-body{margin-top:12px;font-size:14.5px;color:var(--dim);line-height:1.7}
  .primer-body p{margin:0 0 10px}
  .primer-body p:last-child{margin:0}
  .primer-body b{color:var(--text);font-weight:500}
  .primer-body .hot{color:var(--compute)}
  .primer-body .cool{color:var(--bandwidth)}

  /* --- inline glossary terms --- */
  .gl-term{
    font:inherit;color:inherit;background:none;border:none;padding:0;cursor:help;
    border-bottom:1px dashed var(--faint);
  }
  .gl-term:hover{color:var(--text);border-color:var(--bandwidth)}
  .gl-term.open{color:var(--bandwidth);border-color:var(--bandwidth)}
  .gl-note{
    margin:-4px 0 14px;padding:10px 14px;font-size:13.5px;
    background:var(--surface-2);border-left:2px solid var(--bandwidth);
    border-radius:0 5px 5px 0;color:var(--dim);max-width:78ch;
  }
  .gl-note b{color:var(--text)}

  .statline{
    display:flex;gap:28px 40px;flex-wrap:wrap;margin:18px 0 4px;
    padding:16px 20px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;max-width:900px;
  }
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat-k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .stat-v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat-v.good{color:var(--hit)}
  .stat-v.bad{color:var(--reject)}
  .stat-v.warm{color:var(--compute)}
  .stat-v.cool{color:var(--bandwidth)}

  .mini{
    margin-top:20px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:18px 20px;max-width:900px;
  }

  .code-link{
    display:inline-flex;align-items:center;gap:7px;margin-top:14px;
    font-family:var(--mono);font-size:12px;color:var(--faint);
    text-decoration:none;border-bottom:1px dashed var(--line);
    padding-bottom:1px;transition:color .15s,border-color .15s;
  }
  .code-link:hover{color:var(--bandwidth);border-color:var(--bandwidth)}
  .code-link svg{width:13px;height:13px;flex:none;opacity:.7}

  /* small reusable visuals */
  .qtimeline{display:flex;flex-direction:column;gap:6px}
  .qrow{display:flex;align-items:center;gap:10px}
  .qrow-label{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:110px;flex:none}
  .qtrack{position:relative;flex:1;height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
  .qseg{position:absolute;top:0;height:100%;border-radius:3px}

  .memgrid{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:4px}
  .memcell{aspect-ratio:1;border-radius:1px;background:var(--surface-2)}

  .barrow{display:flex;align-items:center;gap:10px;margin:6px 0}
  .barrow-label{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:150px;flex:none}
  .bartrack{flex:1;height:16px;background:var(--surface-2);border-radius:3px;overflow:hidden}
  .barfill{height:100%;border-radius:3px}
  .barval{font-family:var(--mono);font-size:11px;color:var(--text);width:64px;text-align:right;flex:none}

  .mini-caption{margin:12px 0 0;font-family:var(--mono);font-size:11px;color:var(--faint)}

  footer{padding:40px 0 64px;color:var(--faint);font-size:13px;border-top:1px solid var(--line-soft)}
  footer a{color:var(--dim)}
  footer code{font-family:var(--mono);font-size:12px}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="lang-en" type="button">EN</button>
  <button id="lang-zh" type="button">中文</button>
</div>

<header>
  <div class="wrap">
    <p class="eyebrow" id="t-eyebrow"></p>
    <h1 id="t-h1"></h1>
    <p class="lede" id="t-lede"></p>
    <details class="primer" id="primer" open>
      <summary id="t-primer-summary"></summary>
      <div class="primer-body" id="t-primer-body"></div>
    </details>
  </div>
</header>

<div class="pipeline-wrap">
  <div class="wrap">
    <div class="pipeline-controls">
      <button id="replay-btn"></button>
      <span class="pipeline-hint" id="t-hint"></span>
    </div>
    <div class="pipeline">
      <div class="track" id="track"><!-- populated by JS --></div>
      <div class="packet" id="packet"></div>
    </div>
  </div>
</div>

<main class="wrap" id="stages"><!-- populated by JS --></main>

<footer class="wrap">
  <p id="t-footer"></p>
</footer>

<script>
(function(){
"use strict";
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- static UI text ---------------- */
const UI = {
  title:      { en:"The Journey of One Request", zh:"一个请求的旅程" },
  eyebrow:    { en:"Qwen2.5-7B-Instruct · A100 80GB · vLLM · every number is reproducible",
                zh:"Qwen2.5-7B-Instruct · A100 80GB · vLLM · 全部数据可复现" },
  h1:         { en:"The Journey of One Request", zh:"一个请求的旅程" },
  lede:       { en:`From the moment you hit send to the moment the first word appears —
                    and the two-hundredth — twelve things happen in between. Some happen
                    once. Some happen again for every single word.
                    <b>Click any stage on the timeline below to see the details;
                    or don't — autoplay will walk you through the whole journey first.</b>`,
                zh:`从你按下发送，到第一个字出现，再到第两百个字出现——中间发生了十二件事。
                    有的只发生一次，有的每个字都要重来一遍。<b>点下面时间线上的任意一站，
                    往下看细节；不点也行，自动播放会带你走一遍全程。</b>` },
  replay:     { en:"▶ Replay the journey", zh:"▶ 重新播放全程" },
  hint:       { en:"or click any stage directly", zh:"或者直接点任意一站" },
  loopTag:    { en:"repeats once per token", zh:"每个 token 重复一次" },
  viewCode:   { en:"View the experiment", zh:"查看实验代码" },
  primerSummary: { en:"NEW TO THIS?  THE ONE IDEA THE WHOLE PAGE IS BUILT ON",
                   zh:"第一次看？  这一页建立在一个想法上" },
  primerBody: {
    en:`<p>The model's numbers — its "weights", about 14 GB — are far too big to sit
        inside the GPU's tiny fast math units. They live in the GPU's main memory, and
        <b>every time the model runs, all 14 GB have to be streamed from that memory
        through the math units.</b> That trip takes a few milliseconds and it is
        usually the slowest thing happening.</p>
        <p>So the question that decides speed is: <b>how many tokens does one
        14-GB trip produce?</b></p>
        <p>Reading your prompt (the <span class="hot">prefill</span> phase) does all
        its tokens together in one trip — hundreds of tokens per trip, so the math
        units stay genuinely busy. Writing the answer (the
        <span class="cool">decode</span> phase) produces just one token per trip, so
        the math is mostly idle and you're just paying for the memory streaming, over
        and over.</p>
        <p>Almost every trick on this page does one of two things:
        <b>get more tokens out of each 14-GB trip</b>, or <b>make each trip smaller</b>.
        Once you see that, the rest follows.</p>`,
    zh:`<p>模型的那些数字——它的"权重"，约 14 GB——远远塞不进 GPU 那点小小的高速计算单元。
        它们住在 GPU 的主显存里，<b>模型每跑一次，这 14 GB 全部都要从显存流经计算单元一遍。</b>
        这趟要花几毫秒，而且通常是全程最慢的一环。</p>
        <p>所以决定速度的问题是：<b>一趟 14 GB 的搬运，能产出多少个 token？</b></p>
        <p>读你的 prompt（<span class="hot">prefill</span> 阶段）把所有 token 放在一趟里一起算——
        一趟几百个 token，所以计算单元是真的在忙。写答案（<span class="cool">decode</span> 阶段）
        一趟只产出一个 token，所以算力大部分闲着，你只是在一遍遍地为显存流动付钱。</p>
        <p>这一页几乎每个技巧，都在做两件事之一：<b>让每趟 14 GB 搬运产出更多 token</b>，
        或者<b>让每趟搬运更小</b>。看懂这个，后面就顺了。</p>`,
  },
  footer:     { en:`Data from <code>benchmarks/README.md</code>, Qwen2.5-7B-Instruct, A100-80GB,
                    fp16, vLLM · every experiment is reproducible:
                    <code>modal run experiments/wkXX_*/*.py</code> · also see the
                    <a href="phase1.html">topic-by-topic interactive breakdown</a> and the
                    <a href="week11_roofline.html">roofline deep dive</a>`,
                zh:`数据来自 <code>benchmarks/README.md</code>，Qwen2.5-7B-Instruct，A100-80GB，
                    fp16，vLLM · 全部实验可复现：<code>modal run experiments/wkXX_*/*.py</code> ·
                    另见 <a href="phase1.html">按主题拆解的交互图</a> 和
                    <a href="week11_roofline.html">roofline 深潜</a>` },
};

/* ---------------- glossary (bilingual) ---------------- */
const GLOSSARY = {
  "gpu": {
    en:`One physical accelerator card. "GPU" and "card" mean the same thing on this
        page. It can serve many requests at once by interleaving them, not by having
        separate hardware per person.`,
    zh:`一张物理加速卡。本页里"GPU"和"卡"是同一个东西。它靠交错处理来同时服务很多请求，
        不是每人一套硬件。` },
  "a100": {
    en:`NVIDIA's data-center GPU from 2020. The "80GB" is how much fast memory it has
        on board. Every number on this page was measured on one A100.`,
    zh:`NVIDIA 2020 年的数据中心 GPU。"80GB"指它自带的高速显存。本页所有数字都在一张 A100 上测得。` },
  "vllm": {
    en:`An open-source serving engine for LLMs — the software layer that schedules
        requests, manages memory, and runs the model. Most of the tricks here are
        vLLM features.`,
    zh:`一个开源的 LLM 服务引擎——负责调度请求、管理显存、跑模型的那层软件。本页大部分技巧都是它的功能。` },
  "batch": {
    en:`A group of requests the GPU processes together in one pass. One pass streams
        the weights once regardless of how many requests ride along, so a bigger batch
        spreads that fixed 14-GB cost over more tokens. But it isn't free forever:
        the requests all have to fit in memory, past a point the math itself becomes
        the limit (see roofline), and a bigger batch also makes each request wait
        longer — a throughput-vs-latency tradeoff.`,
    zh:`GPU 一次处理的一组请求。一趟只把权重流一遍，不管带几条请求，所以 batch 越大，
        这份 14 GB 的固定成本被摊到越多 token 上。但也不是无限免费：请求都要装进显存，
        过了某个点算术本身会成为瓶颈（见 roofline），而且 batch 越大每条请求等得越久——
        是吞吐和延迟之间的取舍。` },
  "continuous-batching": {
    en:`Instead of collecting a fixed group of requests and running them as one block,
        the engine keeps a batch that's always in motion: a new request joins the
        moment it arrives, a finished one drops out immediately. Same GPU work,
        far less waiting.`,
    zh:`不是攒够一组固定的请求再当一整块跑，而是让 batch 始终流动：新请求一到就加入，
        跑完一条立刻退出。GPU 做的活一样多，等待少得多。` },
  "concurrency": {
    en:`How many requests are being served at the same moment. It's related to batch
        size but not identical — batch size is how many the GPU processes in one pass,
        concurrency is how many exist in the system at once. "Under load" / "high
        concurrency" means many.`,
    zh:`同一时刻正在被服务的请求数。跟 batch 大小相关但不完全一样——batch 大小是 GPU 一趟处理几条，
        并发是系统里同时存在几条。"高负载"/"高并发"就是很多条。` },
  "dense": {
    en:`A regular model where every parameter is used for every token — the opposite of
        mixture-of-experts. A "small dense model" here is one whose total size equals
        the MoE's active-parameter count, used as a speed reference.`,
    zh:`常规模型，每个 token 都用到全部参数——和混合专家相反。这里"同等小稠密模型"指
        总大小等于 MoE 激活参数量的那种，用来当速度参照。` },
  "kernel": {
    en:`The actual GPU code that carries out one operation — a matrix multiply, an
        "expand this compressed number back to full precision", and so on. A "fused
        kernel" does several of those steps in one shot instead of writing intermediate
        results back to memory between them.`,
    zh:`真正在 GPU 上执行某一个操作的代码——一次矩阵乘、一次"把这个压缩数字还原回全精度"等等。
        "融合 kernel"把好几步合成一趟做完，而不是每步之间把中间结果写回显存。` },
  "kv-cache": {
    en:`As the model generates, it keeps an exact record of intermediate results for
        every token seen so far, so each step doesn't reprocess the whole conversation.
        That record is the KV cache. It grows with every token, lives in GPU memory,
        and is tied to the exact input — change one token and the rest is invalid.`,
    zh:`模型一边生成，一边为已经见过的每个 token 保留一份精确的中间结果，这样每步不用把整段重算一遍。

/* ---------------- language state ---------------- */
let LANG = localStorage.getItem("journey-lang") || "en";
let currentStageId = null;

const track = document.getElementById("track");
const stagesEl = document.getElementById("stages");
const packet = document.getElementById("packet");

function svgLine(){
  return `<svg viewBox="0 0 28 2" preserveAspectRatio="none"><line x1="0" y1="1" x2="28" y2="1"/></svg>`;
}
function tv(field){
  // Accept either a plain string (language-independent) or a {en,zh} object.
  return typeof field === "string" ? field : field[LANG];
}

// Replace [[key]] or [[key|display text]] in body HTML with a clickable glossary term.
function glossify(html){
  return html.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, key, text) => {
    if(!GLOSSARY[key]) return text || key;
    return `<button type="button" class="gl-term" data-g="${key}">${text || key}</button>`;
  });
}

// Delegated: click a glossary term -> toggle a note right after its paragraph.
document.addEventListener("click", (e) => {
  const term = e.target.closest(".gl-term");
  if(!term) return;
  const key = term.dataset.g;
  const para = term.closest("p") || term.parentElement;
  const existing = para.nextElementSibling;
  const isOpenForThis = existing && existing.classList.contains("gl-note") && existing.dataset.g === key;

  document.querySelectorAll(".gl-note").forEach(n => n.remove());
  document.querySelectorAll(".gl-term.open").forEach(t => t.classList.remove("open"));

  if(isOpenForThis) return;  // second click on the same term closes it

  const note = document.createElement("div");
  note.className = "gl-note";
  note.dataset.g = key;
  note.innerHTML = `<b>${term.textContent}</b> — ` + tv(GLOSSARY[key]);
  para.insertAdjacentElement("afterend", note);
  term.classList.add("open");
});

/* ---------------- build the pipeline nodes ---------------- */
function buildPipeline(){
  track.innerHTML = "";
  let loopOpen = false;
  STAGES.forEach((s, i) => {
    if(i > 0){
      const c = document.createElement("div");
      c.className = "connector";
      c.innerHTML = svgLine();
      (loopOpen ? document.getElementById("loop-box") : track).appendChild(c);
    }

    const willEnterLoop = s.kind.includes("loop") && !loopOpen;
    if(willEnterLoop){
      const box = document.createElement("div");
      box.className = "loop-box";
      box.id = "loop-box";
      track.appendChild(box);
      loopOpen = true;
    }

    const parent = loopOpen ? document.getElementById("loop-box") : track;
    const btn = document.createElement("button");
    btn.className = "node" + (s.kind.includes("compute") ? " compute" : "");
    btn.dataset.stage = s.id;
    btn.innerHTML = `<span class="node-dot">${i+1}</span><span class="node-label">${tv(s.label)}</span>`;
    btn.addEventListener("click", () => goTo(s.id, true));
    parent.appendChild(btn);

    if(s.id === "loopback"){
      const tag = document.createElement("div");
      tag.className = "loop-tag";
      tag.textContent = tv(UI.loopTag);
      document.getElementById("loop-box").appendChild(tag);
      loopOpen = false;
    }
  });
}

/* ---------------- build the detail cards ---------------- */
function buildCards(){
  stagesEl.innerHTML = "";
  STAGES.forEach((s, i) => {
    const card = document.createElement("section");
    card.className = "stage-card";
    card.id = "card-" + s.id;

    let statsHtml = "";
    if(s.stats){
      statsHtml = `<div class="statline">` + s.stats.map(st =>
        `<div class="stat"><div class="stat-k">${tv(st.k)}</div><div class="stat-v ${st.cls||''}">${tv(st.v)}</div></div>`
      ).join("") + `</div>`;
    }

    const numCls = s.kind.includes("compute") ? "compute" : (s.kind.includes("loop") ? "bandwidth" : "");

    let codeHtml = "";
    if(s.code){
      // s.code is either one URL string, or an array of {url, label:{en,zh}}
      // for stages whose numbers come from more than one experiment script.
      const links = Array.isArray(s.code) ? s.code : [{url: s.code, label: null}];
      const noteHtml = s.codeNote
        ? `<div class="mini-caption" style="margin:14px 0 0">${glossify(tv(s.codeNote))}</div>` : "";
      const linksHtml = links.map(l => `
        <a class="code-link" href="${l.url}" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4L1 8l4 4M11 4l4 4-4 4"/></svg>
          ${l.label ? tv(l.label) : tv(UI.viewCode)}
        </a>`).join("");
      codeHtml = `${noteHtml}<div style="display:flex;gap:18px;flex-wrap:wrap">${linksHtml}</div>`;
    }

    card.innerHTML = `
      <div class="stage-kicker">
        <span class="stage-num ${numCls}">${String(i+1).padStart(2,"0")}</span>
        <span class="stage-tag">${tv(s.tag)}</span>
      </div>
      <h2>${tv(s.title)}</h2>
      <div class="stage-body">${glossify(tv(s.body))}</div>
      ${statsHtml}
      <div class="mini-slot" data-mini="${s.mini||''}"></div>
      ${codeHtml}
    `;
    stagesEl.appendChild(card);
  });
}

    const cells = Array.from({length:48}, (_,i) => {
      const used = i < 30 && (i%6<4);
      const colors = ["#4CA6E0","#56D68A","#F0883E","#B98BE0"];
      const c = used ? colors[Math.floor(i/8)%4] : "var(--idle)";
      return `<div class="memcell" style="background:${used?c:'var(--surface-2)'}"></div>`;
    }).join("");
    box.innerHTML = `
      <div class="memgrid">${cells}</div>
      <p class="mini-caption">${tv(t.caption)}</p>`;
  }

  if(kind === "prefix"){
    box.innerHTML = `
      <div class="barrow"><span class="barrow-label">${tv(t.rows[0])}</span>
        <div class="bartrack"><div class="barfill" style="width:98%;background:var(--reject)"></div></div>
        <span class="barval">829 ms</span></div>
      <div class="barrow"><span class="barrow-label">${tv(t.rows[1])}</span>
        <div class="bartrack"><div class="barfill" style="width:19%;background:var(--hit)"></div></div>
        <span class="barval">156 ms</span></div>`;
  }

  if(kind === "guess"){
    box.innerHTML = `
      <div class="barrow"><span class="barrow-label">${tv(t.rows[0])}</span>
        <div class="bartrack"><div class="barfill" style="width:92%;background:var(--hit)"></div></div>
        <span class="barval">2.78x</span></div>
      <div class="barrow"><span class="barrow-label">${tv(t.rows[1])}</span>
        <div class="bartrack"><div class="barfill" style="width:28%;background:var(--reject)"></div></div>
        <span class="barval">0.85x</span></div>`;
  }

  if(kind === "roofline"){
    box.innerHTML = `
      <div class="barrow"><span class="barrow-label">${tv(t.rows[0])}</span>
        <div class="bartrack"><div class="barfill" style="width:45%;background:var(--idle)"></div></div>
        <span class="barval">1.00x</span></div>
      <div class="barrow"><span class="barrow-label">${tv(t.rows[1])}</span>
        <div class="bartrack"><div class="barfill" style="width:46%;background:var(--faint)"></div></div>
        <span class="barval">1.03x</span></div>
      <div class="barrow"><span class="barrow-label">${tv(t.rows[2])}</span>
        <div class="bartrack"><div class="barfill" style="width:70%;background:var(--bandwidth)"></div></div>
        <span class="barval">1.56x</span></div>
      <div class="barrow"><span class="barrow-label">${tv(t.rows[3])}</span>
        <div class="bartrack"><div class="barfill" style="width:99%;background:var(--hit)"></div></div>
        <span class="barval">2.20x</span></div>`;
  }

  slot.appendChild(box);
}

/* ---------------- static UI text ---------------- */
function renderUIText(){
  document.title = tv(UI.title);
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.getElementById("t-eyebrow").textContent = tv(UI.eyebrow);
  document.getElementById("t-h1").textContent = tv(UI.h1);
  document.getElementById("t-lede").innerHTML = tv(UI.lede);
  document.getElementById("t-primer-summary").textContent = tv(UI.primerSummary);
  document.getElementById("t-primer-body").innerHTML = glossify(tv(UI.primerBody));
  document.getElementById("replay-btn").textContent = tv(UI.replay);
  document.getElementById("t-hint").textContent = tv(UI.hint);
  document.getElementById("t-footer").innerHTML = tv(UI.footer);
  document.getElementById("lang-en").classList.toggle("active", LANG === "en");
  document.getElementById("lang-zh").classList.toggle("active", LANG === "zh");
}

/* ---------------- interaction: click node -> highlight + scroll ---------------- */
function setActive(id){
  currentStageId = id;
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("active", n.dataset.stage === id));
}

function goTo(id, scroll){
  setActive(id);
  if(scroll){
    const card = document.getElementById("card-" + id);
    card.scrollIntoView({behavior: reduced ? "auto" : "smooth", block: "start"});
    card.classList.remove("flash");
    void card.offsetWidth;
    card.classList.add("flash");
  }
  positionPacketAt(id);
  packet.classList.add("on");
}

/* ---------------- auto-play the journey once on load ---------------- */
function positionPacketAt(id){
  const node = document.querySelector(`.node[data-stage="${id}"] .node-dot`);
  const pipelineEl = document.querySelector(".pipeline");
  if(!node) return;
  const nodeRect = node.getBoundingClientRect();
  const pipeRect = pipelineEl.getBoundingClientRect();
  const left = nodeRect.left - pipeRect.left + pipelineEl.scrollLeft + nodeRect.width/2;
  packet.style.left = left + "px";
}

function autoplay(){
  packet.classList.add("on");
  let i = 0;
  const order = STAGES.map(s => s.id);
  const step = () => {
    if(i >= order.length){ return; }
    positionPacketAt(order[i]);
    setActive(order[i]);
    i++;
  };
  step();
  const timer = setInterval(() => {
    step();
    if(i >= order.length) clearInterval(timer);
  }, reduced ? 30 : 420);
}

/* ---------------- full render (called on init and on language switch) ---------------- */
function render(){
  renderUIText();
  buildPipeline();
  buildCards();
  document.querySelectorAll(".mini-slot").forEach(slot => buildMini(slot, slot.dataset.mini));
  if(currentStageId){
    setActive(currentStageId);
    positionPacketAt(currentStageId);
  }
}

document.getElementById("lang-en").addEventListener("click", () => {
  if(LANG === "en") return;
  LANG = "en"; localStorage.setItem("journey-lang", "en"); render();
});
document.getElementById("lang-zh").addEventListener("click", () => {
  if(LANG === "zh") return;
  LANG = "zh"; localStorage.setItem("journey-lang", "zh"); render();
});

document.getElementById("replay-btn").addEventListener("click", () => {
  document.getElementById("card-arrive").scrollIntoView({behavior: reduced ? "auto" : "smooth"});
  autoplay();
});

window.addEventListener("resize", () => {
  if(currentStageId) positionPacketAt(currentStageId);
});

render();
// kick off once fonts/layout settle
window.addEventListener("load", () => setTimeout(autoplay, 300));
})();
</script>
</body>
</html>
