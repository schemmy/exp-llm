<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serving a Trillion Parameters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#0E141B; --surface:#161F2A; --surface-2:#1E2936;
    --line:#2A3846; --line-soft:#213040;
    --text:#DCE5EE; --dim:#8496A8; --faint:#5D7188;
    --compute:#F0883E; --compute-soft:#5A3A1E;
    --bandwidth:#4CA6E0; --bandwidth-soft:#1B354A;
    --hit:#56D68A; --hit-soft:#1C3E2C;
    --reject:#E05C5C; --measured:#B98BE0; --idle:#313E4C;
    --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --display:"Archivo","IBM Plex Sans","PingFang SC","Hiragino Sans GB",sans-serif;
    --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  .lang-toggle{position:fixed;top:18px;right:18px;z-index:50;display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px;gap:2px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .lang-toggle button{font-family:var(--mono);font-size:11px;font-weight:600;border:none;background:none;color:var(--faint);cursor:pointer;padding:6px 12px;border-radius:16px;transition:all .15s}
  .lang-toggle button:hover{color:var(--text)}
  .lang-toggle button.active{background:var(--bandwidth-soft);color:var(--bandwidth)}

  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#111A24 0%,var(--ground) 100%);padding:52px 0 36px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 14px}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.6vw,46px);letter-spacing:-.02em;line-height:1.1;margin:0 0 16px;text-wrap:balance}
  .lede{max-width:76ch;color:var(--dim);font-size:16.5px;margin:0}
  .lede b{color:var(--text);font-weight:500}
  .lede a{color:var(--bandwidth)}

  .setup{margin-top:22px;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:900px}
  .setup-row{display:flex;gap:24px 36px;flex-wrap:wrap}
  .setup-item{display:flex;flex-direction:column;gap:3px}
  .setup-k{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .setup-v{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text)}

  main{padding:40px 0 80px}

  /* ---------- unified diagram ---------- */
  .diagram-shell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 22px 28px;margin:8px 0 30px;overflow-x:auto;position:relative}
  .legend-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
  .legend{display:flex;gap:20px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
  .legend-dot.act{background:var(--measured);box-shadow:0 0 7px 1px rgba(185,139,224,.65)}
  .legend-dot.wt{background:var(--surface-2);border:1.5px solid var(--faint)}
  .legend-dot.kv{background:var(--surface-2);border:1.5px solid var(--hit)}
  .journey-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
  .play-btn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--bandwidth);background:var(--bandwidth-soft);border:1px solid var(--bandwidth);border-radius:7px;padding:8px 16px;cursor:pointer;flex:none;transition:filter .15s}
  .play-btn:hover{filter:brightness(1.2)}
  .play-btn:disabled{opacity:.45;cursor:default;filter:none}
  .step-btn{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--dim);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 13px;cursor:pointer;flex:none;transition:all .15s}
  .step-btn:hover{color:var(--text);border-color:#3E5064}
  .step-btn:disabled{opacity:.35;cursor:default}

  .scene-caption{min-height:18px;font-family:var(--mono);font-size:12px;color:var(--measured);margin-bottom:14px;transition:opacity .2s}
  .scene-caption:empty{margin-bottom:0}

  .diagram-body{min-width:max-content;position:relative}
  .xrow{display:flex;align-items:flex-start;gap:0}
  .xconn{flex:none;width:30px;align-self:center;height:2px;background:var(--line);position:relative;margin:0 2px}
  .xconn.fast{background:var(--bandwidth);height:2.5px}
  .xconn.slow{background:none;border-top:2.5px dashed var(--compute);height:0}
  .xconn-label{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;color:var(--faint);white-space:nowrap}
  .xconn.pulsing{animation:connpulse .95s ease}
  @keyframes connpulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 5px var(--measured))}}

  .xnode{border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);padding:11px 13px;position:relative;transition:border-color .2s,background .2s,box-shadow .2s;flex:none}
  .xnode.expandable{cursor:pointer}
  .xnode.expandable:hover{border-color:#3E5064}
  .xnode.open{border-color:var(--bandwidth)}
  .xnode.pulsing{animation:boxpulse .95s ease}
  @keyframes boxpulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px rgba(185,139,224,.32)}}
  .xnode.route-target{border-color:var(--measured);background:#241C33}
  .xnode-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .xnode-title{font-family:var(--mono);color:var(--text);font-weight:600;font-size:12px;white-space:nowrap}
  .xnode-sub{font-family:var(--mono);color:var(--faint);font-size:9.5px;margin-top:2px;white-space:nowrap}
  .xnode-toggle{width:17px;height:17px;border-radius:5px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px;flex:none;transition:transform .2s,color .2s,border-color .2s;line-height:1}
  .xnode.open .xnode-toggle{transform:rotate(45deg);color:var(--bandwidth);border-color:var(--bandwidth)}

  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:9px;background:var(--surface);border:1px solid var(--line-soft);color:var(--faint);white-space:nowrap}
  .badge.wt{border-color:var(--faint);color:var(--dim)}
  .badge.kv{border-color:var(--hit);color:var(--hit)}

  .xnest{margin-top:13px}
  .group-box{border:1.5px dashed var(--line);border-radius:11px;padding:16px 13px 10px;position:relative}
  .group-tag{position:absolute;top:-10px;left:14px;background:var(--surface);padding:0 7px;font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.05em;white-space:nowrap}

  .gpu-grid{display:flex;gap:0;margin-top:2px;align-items:flex-start}
  .gpu-box{width:88px}
  .gpu-box.open{width:auto}
  .gpu-box .xnode-title{font-size:11px}

  .sm-nest .xnode-title{font-size:11.5px}

  .packet{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--measured);box-shadow:0 0 10px 2px rgba(185,139,224,.65);transform:translate(-50%,-50%);z-index:6;opacity:0;transition:left .4s ease,top .4s ease;pointer-events:none}
  .packet.on{opacity:1}

  /* ---------- explanatory sections (stacked, no switching) ---------- */
  .level-text{margin:0 0 40px}
  .level-text:last-child{margin-bottom:0}
  .level-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .level-text h2{font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,27px);margin:6px 0 14px;letter-spacing:-.01em}
  .level-body{max-width:88ch;color:var(--dim);font-size:15.5px}
  .level-body p{margin:0 0 12px}
  .level-body b{color:var(--text);font-weight:500}
  .level-body a{color:var(--bandwidth)}

  .statline{display:flex;gap:24px 36px;flex-wrap:wrap;margin:16px 0 4px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:900px}
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat-k{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .stat-v{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat-v.warm{color:var(--compute)} .stat-v.cool{color:var(--bandwidth)} .stat-v.good{color:var(--hit)} .stat-v.bad{color:var(--reject)}

  .code-link{display:inline-flex;align-items:center;gap:7px;margin:14px 14px 0 0;font-family:var(--mono);font-size:12px;color:var(--faint);text-decoration:none;border-bottom:1px dashed var(--line);padding-bottom:1px}
  .code-link:hover{color:var(--bandwidth);border-color:var(--bandwidth)}
  .code-link svg{width:13px;height:13px;opacity:.7}

  hr.sep{border:none;border-top:1px solid var(--line-soft);margin:0 0 32px}

  footer{padding:40px 0 64px;color:var(--faint);font-size:13px;border-top:1px solid var(--line-soft)}
  footer a{color:var(--dim)}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="lang-en" type="button">EN</button>
  <button id="lang-zh" type="button">中文</button>
</div>

<header>
  <div class="wrap">
    <p class="eyebrow" id="t-eyebrow"></p>
    <h1 id="t-h1"></h1>
    <p class="lede" id="t-lede"></p>
    <div class="setup">
      <div class="setup-row" id="setup-row"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="diagram-shell" id="diagram-shell">
    <div class="legend-row">
      <div class="legend" id="legend"></div>
      <div class="journey-controls">
        <button class="step-btn" id="prev-btn" type="button"></button>
        <button class="play-btn" id="play-btn" type="button"></button>
        <button class="step-btn" id="next-btn" type="button"></button>
      </div>
    </div>
    <div class="scene-caption" id="scene-caption"></div>
    <div class="diagram-body" id="diagram-body"></div>
    <div class="packet" id="packet"></div>
  </div>

  <hr class="sep">
  <div id="levels"></div>
</main>

<footer class="wrap"><p id="t-footer"></p></footer>

<script>
(function(){
"use strict";
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let LANG = localStorage.getItem("journey-lang") || "en";
function tv(f){ return typeof f === "string" ? f : f[LANG]; }
function esc(s){ return s; }

/* ---------------- static text content ---------------- */
const UI = {
  title:{en:"Serving a Trillion Parameters", zh:"服务一个万亿参数模型"},
  eyebrow:{en:"~1T-parameter MoE · FP8 · H100 80GB · a worked example, not a specific vendor's system",
           zh:"约 1T 参数 MoE · FP8 · H100 80GB · 一个推演出来的例子，不是某家公司的具体系统"},
  lede:{en:`The <a href="request_journey.html">Journey of One Request</a> walked through
            what happens on <b>one GPU</b>. A model this big doesn't fit on one — or
            eight, or even sixteen without care. Click any box below to zoom in — it's
            one diagram, four levels nested inside each other. <b>Weights stay put</b>
            (labeled on whichever box holds them) and so does the <b>KV cache</b>
            (it only grows, it never travels) — the only thing that ever moves is the
            <b>activation</b> for your one token, and the path it takes changes shape
            depending on which mechanism is moving it.`,
        zh:`<a href="request_journey.html">《一个请求的旅程》</a>走的是<b>一张 GPU</b>
            上发生的事。模型大到这个量级，一张卡装不下——甚至八张、十六张都得精心安排。
            点下面任意一个框就能往里看——这是一张图，四层套在一起。<b>权重待在原地不动</b>
            （标在持有它的那个框上），<b>KV cache</b> 也不动（只会变大，从不搬家）——
            唯一会移动的是你这个 token 的<b>激活值</b>，而它走的路径形状，取决于当下是
            哪种机制在搬它。`},
  footer:{en:`This page works out a standard, publicly-documented deployment pattern from
              first principles — it is not a description of any specific company's
              production system. The small-scale mechanics (TP overhead, EP break-even)
              are measured in <a href="https://github.com/schemmy/exp-llm">this repo</a>;
              see each section below for the exact script. Also see
              <a href="request_journey.html">The Journey of One Request</a>.`,
          zh:`这一页是从第一性原理推演出的一个标准、公开可查的部署模式，不是描述某家公司的
              具体生产系统。小规模的力学关系（TP 开销、EP 盈亏点）是<a href="https://github.com/schemmy/exp-llm">这个仓库</a>
              实测的，下面每节都附了具体脚本。另见 <a href="request_journey.html">《一个请求的旅程》</a>。`},
  legend:[
    {cls:"act", en:"activation — the only thing that moves", zh:"激活值——唯一会移动的东西"},
    {cls:"wt",  en:"weights — static, labeled on their box",  zh:"权重——静止，标在所在的框上"},
    {cls:"kv",  en:"KV cache — static, grows per token",      zh:"KV cache——静止，逐 token 变大"},
  ],
  play:{en:"▶ Play one request's journey", zh:"▶ 播放一个请求的旅程"},
  pause:{en:"⏸ Pause", zh:"⏸ 暂停"},
  resume:{en:"▶ Resume", zh:"▶ 继续"},
  prevStep:{en:"⏮ Prev", zh:"⏮ 上一步"},
  nextStep:{en:"Next ⏭", zh:"下一步 ⏭"},
};

const SETUP = [
  {k:{en:"Model size",zh:"模型规模"}, v:"~1T params"},
  {k:{en:"Active per token",zh:"每 token 激活"}, v:"~32B (MoE)"},
  {k:{en:"Precision",zh:"精度"}, v:"FP8 → 1 byte/param"},
  {k:{en:"Weight footprint",zh:"权重体积"}, v:"~1 TB"},
  {k:{en:"GPU",zh:"GPU"}, v:"H100, 80GB"},
  {k:{en:"Minimum GPUs",zh:"理论最少"}, v:"13 (1TB / 80GB)"},
  {k:{en:"Deployed as",zh:"实际部署"}, v:"16 · 2 nodes × 8"},
];

const LEVELS = [
  {
    id:"dc", tag:{en:"Level 1 of 4 · routing", zh:"第 1/4 层 · 路由"},
    title:{en:"Your request is one of millions — which copy of the model gets it?",
           zh:"你的请求是几百万条里的一条——哪一份模型实例接手？"},
    body:{
      en:`<p>A model this size is far too expensive to run one request at a time.
          The serving fleet holds <b>multiple full copies</b> ("replicas") of the
          whole sharded model, each copy spread across its own set of GPUs. A load
          balancer picks a replica — often the one already holding a matching cached
          prefix (see <a href="request_journey.html#card-prefix">prefix caching</a>)
          — and your request enters that replica's pipeline.</p>
          <p>This layer is <b>data parallelism (DP)</b>: identical copies of the
          model, running independently, existing purely to serve more requests at
          once. Nothing about the model itself is split here — that starts one
          level down.</p>`,
      zh:`<p>这个规模的模型贵到不可能一条请求配一份资源。服务集群里放着<b>好几份完整的
          模型实例</b>，每份实例占用自己的一组 GPU。负载均衡器挑一个实例——通常是
          已经缓存了匹配前缀的那个（见<a href="request_journey.html#card-prefix">前缀缓存</a>）
          ——你的请求就进了那个实例的流水线。</p>
          <p>这一层是<b>数据并行（DP）</b>：完全相同的模型实例各自独立运行，
          存在的唯一目的是同时服务更多请求。模型本身在这一层还没被切开——
          切分从下一层才开始。</p>`,
    },
  },
  {
    id:"node", tag:{en:"Level 2 of 4 · pipeline parallelism, across machines", zh:"第 2/4 层 · 流水线并行，跨机器"},
    title:{en:"Inside one replica: the model's layers are split across physical machines",
           zh:"一个实例内部：模型的层被切开分给不同物理机器"},
    body:{
      en:`<p>16 GPUs means <b>2 physical servers</b> ("nodes") of 8 GPUs each — you
          never split a node's worth of GPUs across parallelism strategies casually,
          because the network link <i>between</i> nodes is roughly
          <b>18x slower</b> than the link <i>inside</i> one (InfiniBand, ~50 GB/s,
          vs. NVLink, ~900 GB/s).</p>
          <p>So the model is cut <b>by layer</b> across nodes — <b>pipeline
          parallelism (PP)</b>. Node 1 holds the first half of the transformer's
          layers, node 2 holds the rest — that split is <b>weights, sitting still</b>,
          which is why the diagram labels it as a badge instead of animating it.
          Your token's activation vector is computed through node 1's layers, then
          physically ships across InfiniBand to node 2 to continue. Only the
          activation travels — not the weights, and not a synchronizing all-reduce
          on every layer. That's deliberately the <i>cheapest</i> thing to send
          across the slow link.</p>`,
      zh:`<p>16 张 GPU 就是 <b>2 台物理服务器</b>（"节点"），每台 8 张——不会随便把
          该在同一节点的 GPU 拆开用不同并行策略，因为节点<i>之间</i>的网络链路比
          节点<i>内部</i>慢了大约 <b>18 倍</b>（InfiniBand ~50 GB/s，对比 NVLink ~900 GB/s）。</p>
          <p>所以模型是<b>按层</b>切给不同节点的——<b>流水线并行（PP）</b>。
          节点 1 装 transformer 前一半的层，节点 2 装剩下的——这个切分是<b>权重，
          原地不动</b>，所以图上把它标成一个徽章，而不是让它动画。你这个 token 的
          激活向量先过完节点 1 的层，再物理上通过 InfiniBand 传到节点 2 继续算。
          只有激活值在跑——不传权重，每层也不用做同步的 all-reduce。
          这本来就是在慢链路上能传的最便宜的东西。</p>`,
    },
    stats:[
      {k:{en:"Intra-node (NVLink)",zh:"节点内（NVLink）"}, v:"~900 GB/s", cls:"good"},
      {k:{en:"Inter-node (InfiniBand)",zh:"节点间（InfiniBand）"}, v:"~50 GB/s", cls:"bad"},
      {k:{en:"Speed gap",zh:"速度差距"}, v:"~18x", cls:"warm"},
    ],
  },
  {
    id:"gpu", tag:{en:"Level 3 of 4 · tensor + expert parallelism, inside one node", zh:"第 3/4 层 · 张量并行 + 专家并行，节点内部"},
    title:{en:"Inside one node: 8 GPUs share every dense layer, and specialize for MoE layers",
           zh:"一个节点内部：8 张 GPU 共享每个稠密层，MoE 层则各自专精"},
    body:{
      en:`<p>Inside a node, NVLink is fast enough to afford the thing that made
          splitting expensive at the node level: a synchronizing communication step
          on every layer. This is <b>tensor parallelism (TP)</b> — you already
          measured it at small scale: each GPU holds a slice of every dense layer's
          weights (again, a static badge — weights don't travel), and the partial
          activations get combined with an
          <a href="request_journey.html#card-split">all-reduce</a> after each one.
          In the diagram this is why <b>all 8 GPU boxes and the lines between them
          light up together</b> — everyone talks to everyone, synchronously. At TP=8
          (vs. the TP=2/4 you tested), expect the per-GPU throughput penalty to
          compound further than the 53% you measured at TP=4.</p>
          <p>For this model's <b>MoE layers</b>, GPUs switch strategy to
          <b>expert parallelism (EP)</b>: each GPU holds a different subset of
          experts (also static), a router decides which few experts each token
          needs, and an <b>all-to-all</b> ships each token's activation to just the
          GPUs holding its experts and back — in the diagram, only the source and
          those 2 targets light up, not all 8. You measured EP as a net loss on a
          60-expert model — it only pays off once expert count is in the hundreds,
          which is exactly where real trillion-scale MoE models (e.g. 256 experts)
          live.</p>`,
      zh:`<p>节点内部 NVLink 够快，撑得起在节点这一层显得太贵的东西：每层都做一次
          同步通信。这就是<b>张量并行（TP）</b>——你已经在小规模测过：每张 GPU
          持有每个稠密层权重的一部分（同样是静止的徽章——权重不动），局部激活值算完后用
          <a href="request_journey.html#card-split">all-reduce</a> 合并。
          图上因此是<b>全部 8 张卡和它们之间的连线一起亮起来</b>——大家同步互相通信。
          TP=8（相对你测过的 TP=2/4）时，预期每卡吞吐的代价会比你在 TP=4 测到的
          53% 继续放大。</p>
          <p>到这个模型的 <b>MoE 层</b>，GPU 切换成<b>专家并行（EP）</b>：
          每张卡持有不同的一部分专家（同样静止），路由器决定每个 token 需要哪几个专家，
          一次 <b>all-to-all</b> 只把每个 token 的激活送到持有对应专家的那几张卡再送回来
          ——图上只有发起的那张卡和那 2 个目标会亮，不是全部 8 张。
          你在 60 个专家的模型上测出 EP 是净亏——只有专家数到几百个才划算，
          而真实的万亿规模 MoE 模型（比如 256 个专家）正好活在这个区间里。</p>`,
    },
    stats:[
      {k:{en:"TP=4 per-GPU throughput (measured)",zh:"TP=4 每卡吞吐（实测）"}, v:"↓ to 53%", cls:"bad"},
      {k:{en:"EP on 60 experts (measured)",zh:"60 专家上的 EP（实测）"}, v:"0.56x, net loss", cls:"bad"},
      {k:{en:"Typical trillion-scale expert count",zh:"万亿规模典型专家数"}, v:"~256", cls:"warm"},
    ],
    code:[
      {url:"https://github.com/schemmy/exp-llm/blob/main/experiments/wk09_tensor_parallel/tp_sweep.py",
       label:{en:"View the TP experiment (measured at TP=2/4)", zh:"查看 TP 实验代码（测的是 TP=2/4）"}},
      {url:"https://github.com/schemmy/exp-llm/blob/main/experiments/wk10_moe/expert_parallel.py",
       label:{en:"View the EP experiment (measured at 60 experts)", zh:"查看 EP 实验代码（测的是 60 个专家）"}},
    ],
  },
  {
    id:"sm", tag:{en:"Level 4 of 4 · one GPU's own memory hierarchy", zh:"第 4/4 层 · 一张 GPU 自己的存储层级"},
    title:{en:"Zoom in on any single GPU, and it's the same story from The Journey — just labeled precisely",
           zh:"放大到任意一张 GPU，还是《旅程》里的那个故事——只是这次叫得更准了"},
    body:{
      en:`<p>Every GPU in this whole 16-card, 2-node structure is independently
          doing what <a href="request_journey.html#card-weights">stage 9</a> of The
          Journey described: streaming its own shard of the weights out of memory
          for every token. This is the <b>one place on this page where weights
          actually move</b> — everywhere else they were a static badge, but here,
          inside a single GPU, they stream: <b>HBM</b> (this GPU's local 80GB) →
          shared <b>L2 cache</b> → each <b>SM</b> (Streaming Multiprocessor — an
          H100 has well over a hundred) pulls its slice into fast on-chip memory,
          where the actual multiply-add math happens in that SM's
          <b>Tensor Cores</b>. The KV cache for every token generated so far is read
          here too — it grows, but it lives in this GPU's HBM the whole time; it
          never gets shipped anywhere.</p>
          <p>This is the same bandwidth-vs-compute story at every scale on this page:
          one GPU's HBM→SM trip, one node's NVLink all-reduce, one replica's
          InfiniBand hop — all of it is, in the end, still just "how many useful
          tokens do we get out of each trip."</p>`,
      zh:`<p>这整套 16 卡、2 节点结构里，每一张 GPU 都在独立做
          <a href="request_journey.html#card-weights">《旅程》第 9 站</a>描述的事：
          每个 token 都要把自己那份权重从显存流一遍。这是这页里<b>唯一一个权重真的会动
          的地方</b>——别的地方它都是静止的徽章，但在一张卡内部，它确实在流动：
          <b>HBM</b>（这张卡本地的 80GB）→ 共享的 <b>L2 缓存</b> → 每个
          <b>SM</b>（Streaming Multiprocessor，H100 有一百多个）把自己那份拉进片上
          高速存储，真正的乘加运算在那个 SM 的 <b>Tensor Core</b> 里发生。到目前为止
          生成过的每个 token 的 KV cache 也是在这里被读取——它会变大，但始终待在这张卡
          自己的 HBM 里，从没被送去别处。</p>
          <p>这页里每个尺度讲的都是同一个带宽 vs 算力的故事：一张卡的
          HBM→SM 这一趟、一个节点的 NVLink all-reduce、一个实例的 InfiniBand
          跳转——说到底都还是"每一趟搬运能换回多少个有用的 token"。</p>`,
    },
  },
];

/* ---------------- diagram state ---------------- */
let state = { replica:"A", node:"n1", gpu:0 };
let journeyActive = false;   // true while a journey is in progress, running or paused
let journeyRunning = false;  // true only while actively stepping (not paused)

function x(o){
  const {id, level, key, title, sub, badges, expandable, open, content, cls} = o;
  return `<div class="xnode ${expandable?'expandable':''} ${open?'open':''} ${cls||''}"
      id="${id}" ${level?`data-level="${level}" data-key="${key}"`:''}>
    <div class="xnode-head">
      <div><div class="xnode-title">${title}</div>${sub?`<div class="xnode-sub">${sub}</div>`:''}</div>
      ${expandable?`<div class="xnode-toggle">+</div>`:''}
    </div>
    ${badges&&badges.length?`<div class="badges">${badges.map(b=>`<span class="badge ${b.cls||''}">${b.text}</span>`).join("")}</div>`:''}
    ${open && content ? `<div class="xnest">${content}</div>` : ''}
  </div>`;
}
function conn(cls, lbl){ return `<div class="xconn ${cls||''}" ${lbl?`id="${lbl.id}"`:''}>${lbl?`<div class="xconn-label">${lbl.text}</div>`:''}</div>`; }

function buildSmLevel(){
  return `<div class="xrow sm-nest">
    ${x({id:"sm-hbm", title:"HBM", sub:"80GB"})}
    ${conn("slow",{text:LANG==='zh'?'流式读取':'stream'})}
    ${x({id:"sm-l2", title:LANG==='zh'?"L2 缓存":"L2 cache", sub:LANG==='zh'?"全卡共享":"shared"})}
    ${conn("fast")}
    ${x({id:"sm-sm", title:"SM", sub:"1 of 132"})}
    ${conn("fast")}
    ${x({id:"sm-tc", title:"Tensor Core", sub:LANG==='zh'?"算乘加":"the math"})}
  </div>`;
}

function buildGpuLevel(nodeId){
  let boxes = [];
  for(let i=0;i<8;i++){
    const gid = nodeId+"-gp"+i;
    const isOpen = state.node===nodeId && state.gpu===i;
    boxes.push(x({
      id:gid, level:"gpu", key:String(i),
      title:(LANG==='zh'?'卡 ':'GPU ')+i,
      badges:[
        {text:(LANG==='zh'?'权重: ':'w: ')+'1/8', cls:"wt"},
        {text:(LANG==='zh'?'KV: 递增':'KV: growing'), cls:"kv"},
      ],
      expandable:true, open:isOpen,
      content: isOpen ? buildSmLevel() : "",
      cls:"gpu-box",
    }));
  }
  const withConns = boxes.map((b,i)=> i===0? b : conn("fast")+b).join("");
  return `<div class="group-box">
    <div class="group-tag">${LANG==='zh'?'一个节点内，NVLink 全互联':'One node, NVLink-connected'}</div>
    <div class="gpu-grid">${withConns}</div>
  </div>`;
}

function buildNodeLevel(){
  const meta = {
    n1:{title:"Node 1", layers: LANG==='zh'?'层 1-30':'layers 1-30'},
    n2:{title:"Node 2", layers: LANG==='zh'?'层 31-60':'layers 31-60'},
  };
  const n1open = state.node==="n1", n2open = state.node==="n2";
  const b1 = x({id:"n1", level:"node", key:"n1", title:meta.n1.title, sub:"8× H100",
      badges:[{text:(LANG==='zh'?'权重: ':'weights: ')+meta.n1.layers, cls:"wt"}],
      expandable:true, open:n1open, content: n1open? buildGpuLevel("n1") : ""});
  const b2 = x({id:"n2", level:"node", key:"n2", title:meta.n2.title, sub:"8× H100",
      badges:[{text:(LANG==='zh'?'权重: ':'weights: ')+meta.n2.layers, cls:"wt"}],
      expandable:true, open:n2open, content: n2open? buildGpuLevel("n2") : ""});
  return `<div class="xrow" style="align-items:flex-start">
    ${b1}
    ${conn("slow",{id:"conn-pp", text:"InfiniBand ~50GB/s"})}
    ${b2}
  </div>`;
}

function buildDiagram(){
  const reps = ["A","B","C"].map(r => {
    const isOpen = state.replica === r;
    return x({
      id:"rep-"+r, level:"replica", key:r,
      title:(LANG==='zh'?'实例 ':'Replica ')+r, sub:"16 GPU",
      expandable:true, open:isOpen,
      content: isOpen ? buildNodeLevel() : "",
    });
  });
  const repsRow = reps.map((r,i)=> i===0? r : conn("fast")+r).join("");
  return `<div class="xrow" style="align-items:flex-start">
    ${x({id:"lb", title:LANG==='zh'?'负载均衡':'Load balancer', sub:LANG==='zh'?'路由请求':'routes requests'})}
    ${conn("fast")}
    <div class="group-box">
      <div class="group-tag">${LANG==='zh'?'实例（数据并行）':'Replicas (data parallel)'}</div>
      <div class="xrow">${repsRow}</div>
    </div>
  </div>`;
}

function renderDiagram(){
  document.getElementById("diagram-body").innerHTML = buildDiagram();
  if(!journeyActive){
    const p = document.getElementById("packet");
    if(p) p.classList.remove("on");
  }
}

/* ---------------- toggle interaction ---------------- */
document.addEventListener("click", e => {
  const el = e.target.closest(".xnode.expandable");
  if(!el || !document.getElementById("diagram-shell").contains(el)) return;
  if(journeyActive) return;
  const level = el.dataset.level, key = el.dataset.key;
  if(level === "replica"){
    if(state.replica === key){ state.replica = null; state.node = null; state.gpu = null; }
    else { state.replica = key; state.node = "n1"; state.gpu = 0; }
  } else if(level === "node"){
    if(state.node === key){ state.node = null; state.gpu = null; }
    else { state.node = key; state.gpu = 0; }
  } else if(level === "gpu"){
    const idx = parseInt(key,10);
    state.gpu = (state.gpu === idx) ? null : idx;
  }
  renderDiagram();
});

/* ---------------- animated "play the journey" sequence ---------------- */
const CAP = {
  dp:{en:"① Data-parallel routing — the load balancer picks a replica", zh:"① 数据并行路由——负载均衡器挑一个实例"},
  enter:{en:"② Entering the replica's first node", zh:"② 进入实例的第一个节点"},
  allreduce:{en:"③ Tensor-parallel all-reduce — every GPU synchronizes on this dense layer (only the activation moves; weights stay put)", zh:"③ 张量并行 all-reduce——这个稠密层里所有卡同步（只有激活值在动，权重不动）"},
  alltoall:{en:"④ MoE all-to-all — routed to 2 of 8 experts, not broadcast to all", zh:"④ MoE all-to-all——只路由到 8 个专家里的 2 个，不是广播给全部"},
  smzoom:{en:"⑤ Inside GPU 0: weights stream HBM → L2 → SM → Tensor Core — the one place they actually move", zh:"⑤ GPU 0 内部：权重从 HBM → L2 → SM → Tensor Core 流过——这是它们唯一真正移动的地方"},
  pphop:{en:"⑥ Pipeline hop — the activation crosses InfiniBand to node 2 (18x slower than NVLink)", zh:"⑥ 流水线跳转——激活值跨 InfiniBand 传到节点 2（比 NVLink 慢 18 倍）"},
  echo:{en:"⑦ Node 2 runs the same TP + EP dance on its half of the layers", zh:"⑦ 节点 2 在自己那一半层上做同样的 TP + EP"},
  done:{en:"Token emitted.", zh:"Token 生成完毕。"},
};

function setCaption(c){ document.getElementById("scene-caption").textContent = c ? tv(c) : ""; }
function posPacketAt(elId){
  let el = document.getElementById(elId);
  const shell = document.getElementById("diagram-shell");
  const packet = document.getElementById("packet");
  if(!el || !shell || !packet) return;
  const head = el.querySelector(":scope > .xnode-head");
  if(head) el = head;
  const er = el.getBoundingClientRect(), sr = shell.getBoundingClientRect();
  packet.style.left = (er.left - sr.left + er.width/2 + shell.scrollLeft) + "px";
  packet.style.top  = (er.top  - sr.top  + er.height/2 + shell.scrollTop) + "px";
}
function pulseGroup(ids){
  ids.forEach(id => { const el = document.getElementById(id); if(el) el.classList.add("pulsing"); });
  setTimeout(() => ids.forEach(id => { const el = document.getElementById(id); if(el) el.classList.remove("pulsing"); }), reduced ? 60 : 950);
}
function pulseRoute(srcId, targetIds){
  const src = document.getElementById(srcId);
  if(src) src.classList.add("pulsing");
  targetIds.forEach(id => { const el = document.getElementById(id); if(el) el.classList.add("route-target"); });
  setTimeout(() => {
    if(src) src.classList.remove("pulsing");
    targetIds.forEach(id => { const el = document.getElementById(id); if(el) el.classList.remove("route-target"); });
  }, reduced ? 60 : 950);
}

/* Flat list of atomic steps so playback can pause/resume at any boundary
   instead of running as one uninterruptible async sequence. */
function buildJourneySteps(){
  const gpuIds = ["n1-gp0","n1-gp1","n1-gp2","n1-gp3","n1-gp4","n1-gp5","n1-gp6","n1-gp7"];
  return [
    {cap:CAP.dp,        dur:150,  action:()=>{ posPacketAt("lb"); }},
    {cap:CAP.dp,        dur:750,  action:()=>{ posPacketAt("rep-A"); }},
    {cap:CAP.enter,     dur:750,  action:()=>{ posPacketAt("n1"); }},
    {cap:CAP.allreduce, dur:1050, action:()=>{ pulseGroup(gpuIds); }},
    {cap:CAP.alltoall,  dur:1050, action:()=>{ pulseRoute("n1-gp0", ["n1-gp2","n1-gp5"]); }},
    {cap:CAP.smzoom,    dur:500,  action:()=>{ posPacketAt("sm-hbm"); }},
    {cap:CAP.smzoom,    dur:500,  action:()=>{ posPacketAt("sm-l2"); }},
    {cap:CAP.smzoom,    dur:500,  action:()=>{ posPacketAt("sm-sm"); }},
    {cap:CAP.smzoom,    dur:550,  action:()=>{ posPacketAt("sm-tc"); }},
    {cap:CAP.pphop,     dur:950,
      action:()=>{ const c=document.getElementById("conn-pp"); if(c) c.classList.add("pulsing"); posPacketAt("n2"); },
      cleanup:()=>{ const c=document.getElementById("conn-pp"); if(c) c.classList.remove("pulsing"); }},
    {cap:CAP.echo,      dur:950,
      action:()=>{ const n2=document.getElementById("n2"); if(n2) n2.classList.add("pulsing"); },
      cleanup:()=>{ const n2=document.getElementById("n2"); if(n2) n2.classList.remove("pulsing"); }},
    {cap:CAP.done,      dur:700,  action:()=>{}, final:true},
  ];
}

let journeySteps = null, journeyIdx = 0, journeyTimer = null;

function setPlayBtnMode(mode){
  const btn = document.getElementById("play-btn");
  btn.dataset.mode = mode;
  btn.textContent = mode==="pause" ? tv(UI.pause) : mode==="resume" ? tv(UI.resume) : tv(UI.play);
}

function updateStepBtnStates(){
  const prev = document.getElementById("prev-btn");
  if(prev) prev.disabled = !journeyActive || journeyIdx <= 0;
}

function scheduleJourneyStep(){
  if(journeyIdx >= journeySteps.length){ finishJourney(); return; }
  const s = journeySteps[journeyIdx];
  setCaption(s.cap);
  s.action();
  journeyTimer = setTimeout(() => {
    if(s.cleanup) s.cleanup();
    if(s.final){ finishJourney(); return; }
    journeyIdx++;
    updateStepBtnStates();
    scheduleJourneyStep();
  }, reduced ? 20 : s.dur);
}

function initJourneyBase(){
  state = {replica:"A", node:"n1", gpu:0};
  renderDiagram();
  document.getElementById("packet").classList.add("on");
  journeySteps = buildJourneySteps();
  journeyIdx = 0;
  journeyActive = true;
}

function startJourney(){
  initJourneyBase();
  journeyRunning = true;
  setPlayBtnMode("pause");
  updateStepBtnStates();
  scheduleJourneyStep();
}

function pauseJourney(){
  clearTimeout(journeyTimer);
  journeyTimer = null;
  journeyRunning = false;
  setPlayBtnMode("resume");
  updateStepBtnStates();
}

function resumeJourney(){
  journeyRunning = true;
  setPlayBtnMode("pause");
  updateStepBtnStates();
  scheduleJourneyStep();
}

function finishJourney(){
  clearTimeout(journeyTimer);
  journeyTimer = null;
  const p = document.getElementById("packet");
  if(p) p.classList.remove("on");
  setCaption(null);
  journeyActive = false;
  journeyRunning = false;
  journeySteps = null; journeyIdx = 0;
  setPlayBtnMode("play");
  updateStepBtnStates();
}

/* jump to an arbitrary step, cleaning up whatever the current step was
   doing first; used by both the prev/next buttons */
function gotoStep(newIdx){
  if(journeySteps && journeyIdx >= 0 && journeyIdx < journeySteps.length){
    const cur = journeySteps[journeyIdx];
    if(cur.cleanup) cur.cleanup();
  }
  if(newIdx < 0) newIdx = 0;
  if(!journeySteps || newIdx >= journeySteps.length){ finishJourney(); return; }
  journeyIdx = newIdx;
  const s = journeySteps[journeyIdx];
  setCaption(s.cap);
  s.action();
  setPlayBtnMode("resume");
  updateStepBtnStates();
}

function stopAutoTimer(){
  clearTimeout(journeyTimer);
  journeyTimer = null;
  journeyRunning = false;
}

function stepForward(){
  stopAutoTimer();
  if(!journeyActive){ initJourneyBase(); gotoStep(0); }
  else { gotoStep(journeyIdx + 1); }
}

function stepBack(){
  if(!journeyActive) return;
  stopAutoTimer();
  gotoStep(journeyIdx - 1);
}

function toggleJourney(){
  const mode = document.getElementById("play-btn").dataset.mode || "play";
  if(mode === "play") startJourney();
  else if(mode === "pause") pauseJourney();
  else if(mode === "resume") resumeJourney();
}

/* ---------------- header / legend / levels ---------------- */
function renderHeader(){
  document.title = tv(UI.title);
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.getElementById("t-eyebrow").textContent = tv(UI.eyebrow);
  document.getElementById("t-h1").textContent = tv(UI.title);
  document.getElementById("t-lede").innerHTML = tv(UI.lede);
  document.getElementById("t-footer").innerHTML = tv(UI.footer);
  document.getElementById("lang-en").classList.toggle("active", LANG==="en");
  document.getElementById("lang-zh").classList.toggle("active", LANG==="zh");

  document.getElementById("setup-row").innerHTML = SETUP.map(s => `
    <div class="setup-item"><div class="setup-k">${tv(s.k)}</div><div class="setup-v">${s.v}</div></div>
  `).join("");

  document.getElementById("legend").innerHTML = UI.legend.map(l => `
    <div class="legend-item"><span class="legend-dot ${l.cls}"></span>${tv(l)}</div>
  `).join("");
  setPlayBtnMode(document.getElementById("play-btn").dataset.mode || "play");
  document.getElementById("prev-btn").textContent = tv(UI.prevStep);
  document.getElementById("next-btn").textContent = tv(UI.nextStep);
  updateStepBtnStates();
}

function renderLevels(){
  document.getElementById("levels").innerHTML = LEVELS.map(l => {
    let statsHtml = "";
    if(l.stats){
      statsHtml = `<div class="statline">` + l.stats.map(st =>
        `<div class="stat"><div class="stat-k">${tv(st.k)}</div><div class="stat-v ${st.cls||''}">${st.v}</div></div>`
      ).join("") + `</div>`;
    }
    let codeHtml = "";
    if(l.code){
      codeHtml = l.code.map(c => `
        <a class="code-link" href="${c.url}" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4L1 8l4 4M11 4l4 4-4 4"/></svg>
          ${tv(c.label)}
        </a>`).join("");
    }
    return `
      <section class="level-text" id="lvl-${l.id}">
        <span class="level-tag">${tv(l.tag)}</span>
        <h2>${tv(l.title)}</h2>
        <div class="level-body">${tv(l.body)}</div>
        ${statsHtml}
        ${codeHtml}
      </section>`;
  }).join("");
}

function renderAll(){
  renderHeader();
  renderLevels();
  renderDiagram();
}

document.getElementById("play-btn").addEventListener("click", toggleJourney);
document.getElementById("prev-btn").addEventListener("click", stepBack);
document.getElementById("next-btn").addEventListener("click", stepForward);
document.getElementById("lang-en").addEventListener("click", () => {
  if(LANG==="en") return; LANG="en"; localStorage.setItem("journey-lang","en"); renderAll();
});
document.getElementById("lang-zh").addEventListener("click", () => {
  if(LANG==="zh") return; LANG="zh"; localStorage.setItem("journey-lang","zh"); renderAll();
});

renderAll();
})();
</script>
